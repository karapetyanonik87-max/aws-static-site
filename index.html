<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneaker Vault</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f0f0f;
color:white;
}

header{
padding:30px;
text-align:center;
font-size:38px;
font-weight:bold;
letter-spacing:3px;
background:linear-gradient(90deg,#111,#1f1f1f);
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(to bottom,#111,#000);
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
color:#bbb;
max-width:700px;
margin-bottom:30px;
}

.btn{
padding:15px 35px;
background:white;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:30px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.08);
}

.products{
padding:60px 30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:#1b1b1b;
padding:20px;
border-radius:18px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
border-radius:14px;
margin-bottom:15px;
}

.card h3{
margin-bottom:10px;
}

footer{
padding:30px;
text-align:center;
color:#777;
}
</style>
</head>
<body>

<header>SNEAKER VAULT</header>

<section class="hero">
<h1>Walk Different</h1>
<p>Premium sneakers collection inspired by street culture, speed and style.</p>
<a href="#shop" class="btn">Shop Now</a>
</section>

<section class="products" id="shop">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="">
<h3>Velocity Red</h3>
<p>$149</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=600" alt="">
<h3>Urban Shadow</h3>
<p>$169</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600" alt="">
<h3>Sky Runner</h3>
<p>$159</p>
</div>

</section>

<footer>
2026 Sneaker Vault. Built on AWS.
</footer>

</body>
</html>
